name: Android CI

on:
  push:
    branches:
      - "**"
    tags:
      - v*
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p app
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
            echo "Using google-services.json decoded from GOOGLE_SERVICES_JSON_BASE64."
            echo "HAS_REAL_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured; using a CI-only Firebase placeholder."
            echo "The APK still builds and installs; Firebase news push and Crashlytics stay inactive."
            echo "HAS_REAL_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

          python3 -m json.tool app/google-services.json > /dev/null
          python3 - <<'PY'
          import json
          import sys

          expected = "org.levimc.launcher"
          with open("app/google-services.json", encoding="utf-8") as fp:
              data = json.load(fp)

          package_names = {
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              for client in data.get("client", [])
          }
          if expected not in package_names:
              actual = ", ".join(sorted(name for name in package_names if name)) or "<none>"
              print(
                  f"google-services.json package_name mismatch: expected {expected}, got {actual}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Verify installed SDK Packages
        run: sdkmanager --list

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Prepare signing keystore
        env:
          SIGNING_KEY_STORE: ${{ secrets.SIGNING_KEY_STORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ALIAS="${SIGNING_KEY_ALIAS:-levilauncher}"
          STORE_PASSWORD="${SIGNING_STORE_PASSWORD:-android}"
          KEY_PASSWORD="${SIGNING_KEY_PASSWORD:-android}"
          KEYSTORE="$RUNNER_TEMP/release.keystore"

          if [ -n "${SIGNING_KEY_STORE:-}" ]; then
            printf '%s' "${SIGNING_KEY_STORE}" | base64 --decode > "$KEYSTORE"
            echo "Signing with the repository signing secrets."
          else
            echo "No signing secrets configured; generating a throwaway keystore so the APK stays installable."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=LeviLauncher CI, OU=CI, O=LeviLauncher, L=NA, ST=NA, C=US" > /dev/null
          fi

          {
            echo "SIGN_KEYSTORE=$KEYSTORE"
            echo "SIGN_ALIAS=$ALIAS"
            echo "SIGN_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SIGN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Debug, Beta and Release APKs
        run: |
          set -euo pipefail

          GRADLE_FLAGS=""
          if [ "${HAS_REAL_GOOGLE_SERVICES:-false}" != "true" ]; then
            GRADLE_FLAGS="-PdisableFirebaseUpload"
            echo "Disabling Crashlytics mapping/symbol uploads for this placeholder build."
          fi

          ./gradlew assembleDebug assembleBeta assembleRelease $GRADLE_FLAGS

      - name: Sign release APK
        id: sign
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            UNSIGNED="app/build/outputs/apk/release/app-release.apk"
          fi
          if [ ! -f "$UNSIGNED" ]; then
            echo "Release APK not found; available outputs:" >&2
            find app/build/outputs/apk -name '*.apk' >&2 || true
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            LABEL="${GITHUB_REF_NAME}"
          else
            LABEL="${GITHUB_SHA::7}"
          fi
          SIGNED="LeviLauncher-${LABEL}-release.apk"

          "$BUILD_TOOLS/zipalign" -p -f -v 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$SIGN_KEYSTORE" \
            --ks-key-alias "$SIGN_ALIAS" \
            --ks-pass "pass:$SIGN_STORE_PASSWORD" \
            --key-pass "pass:$SIGN_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED"

          echo "signed_apk=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "Signed APK: $SIGNED"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-beta-apk
          path: app/build/outputs/apk/beta/*.apk
          if-no-files-found: warn

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: LeviLauncher-release-apk
          path: ${{ steps.sign.outputs.signed_apk }}
          if-no-files-found: error

      - name: Generate GitHub release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/render_release_notes.py resources/launcher/changelog.json release-notes.md

      - name: Release APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign.outputs.signed_apk }}
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_URL: "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.sign.outputs.signed_apk }}"
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK is not configured; skipping the release announcement."
            exit 0
          fi

          EMBED_TITLE="🚀 LeviLauncher Update!"
          EMBED_DESC="A new version of **LeviLaunchroid** is ready."
          EMBED_COLOR=5814783
          THUMB_URL='https://avatars.githubusercontent.com/u/78095377?s=200&v=4'

          curl -H "Content-Type: application/json" \
          -d "{
            \"embeds\": [{
              \"title\": \"$EMBED_TITLE\",
              \"description\": \"$EMBED_DESC\",
              \"color\": $EMBED_COLOR,
              \"thumbnail\": { \"url\": \"$THUMB_URL\" },
              \"fields\": [
                {
                  \"name\": \"📦 Version\",
                  \"value\": \"\`$TAG_NAME\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"🔗 Download\",
                  \"value\": \"[**Click here to download APK**]($APK_URL)\",
                  \"inline\": true
                }
              ]
            }]
          }" \
          "$DISCORD_WEBHOOK"
